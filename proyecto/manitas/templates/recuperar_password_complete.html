{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="text-center mb-4">
          <h2 class="fw-bold text-success">Contraseña restablecida</h2>
          <p class="text-muted">
            Tu contraseña ha sido actualizada correctamente. Ahora puedes iniciar sesión con tus nuevas credenciales.
          </p>
        </div>

        <div class="text-center mt-4">
          <a href="{% url 'login' %}" class="btn btn-morado btn-lg fw-bold">
            Ir al inicio de sesión
          </a>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}
