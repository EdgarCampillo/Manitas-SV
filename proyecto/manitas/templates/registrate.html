{% extends "base.html" %}
{% load static %}

{% block content %}

<!--  REGISTRO DE USUARIO-->
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="text-center mb-4">
          <h2 class="fw-bold">Crear una cuenta</h2>
          <p class="text-muted">Unite a Manitas SV y comenzá tu aprendizaje en LESSA 🤟</p>
        </div>

        <form method="POST" action="#">
          {% csrf_token %}

          <div class="mb-3">
            <label for="nombre" class="form-label fw-bold">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Luis Martínez" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-bold">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Ej. luis@email.com" required>
          </div>

          <div class="mb-3">
            <label for="usuario" class="form-label fw-bold">Nombre de usuario</label>
            <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Ej. luismartinez" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-bold">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
          </div>

          <div class="mb-3">
            <label for="confirmar" class="form-label fw-bold">Confirmar contraseña</label>
            <input type="password" class="form-control" id="confirmar" name="confirmar" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-morado btn-lg fw-bold">Registrarse</button>
          </div>

          <div class="text-center mt-3">
            <p class="small">¿Ya tenés cuenta? <a href="{% url 'login' %}" class="text-decoration-none fw-bold text-primary">Ingresá aquí</a></p>
          </div>
        </form>

      </div>
    </div>
  </div>
</section>

{% endblock %}
